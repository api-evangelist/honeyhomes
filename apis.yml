aid: honeyhomes
name: Honeyhomes
description: Honey Homes is a home-maintenance membership service that pairs each
  member with a dedicated, vetted handyman who handles repairs, upgrades, seasonal
  upkeep, and preventive maintenance around the house. Members book visits, add tasks,
  receive photo updates, and stay connected to their handyman and team through a
  companion mobile app. Founded in 2021 by Vishwas and Avantika Prabhakara and backed
  by Khosla Ventures, the company operates as a licensed, bonded, and insured General
  Contractor and serves select California and Texas markets including the San
  Francisco Bay Area and Dallas. Surfaced in the API Evangelist network as a
  Khosla Ventures portfolio company; the company exposes a consumer mobile app but
  no public developer API surface at this time.
